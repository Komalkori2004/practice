<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card layout</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            color: #000;
            font-size: 20px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            height: 70vh;

        }

        .box {
            width: 300px;
            height: 300px;
            background-color: aqua;
            border: 1px solid black;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            cursor: pointer ;

        }
        .active:hover{
            transform: scale(1.1);
        }

        .active{
            background-color: lightcoral;
            color: #fff;
            border-radius: 15px;
        }
    </style>
</head>


<body>
    <h1>Hello, World!</h1>
    <div class="container">
        <div class="box" onclick="changeStyle(this)">box1</div>
        <div class="box" onclick="changeStyle(this)">box2</div>
        <div class="box" onclick="changeStyle(this)">box3</div>

    </div>
</body>

<script>
 function changeStyle(element){
    element.classList.toggle("active");


    console.log(element.innerText + " was clicked!")

 }

</script>

</html>
